<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BC electricity trade</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#6b7280;--exp:#0f8a5f;--imp:#c2410c;--us:#2563eb;--ab:#d97706;--arb:#7c3aed;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0}
h2{font-size:1rem;margin:22px 0 8px}
.k{color:var(--mute);font-size:.8rem}
.pos{color:var(--exp)}.neg{color:var(--imp)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
.live{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:.85rem}
.pill b{font-size:1rem}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 10px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.tabs button{border:0;background:none;padding:7px 12px;font-size:.85rem;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}
.card h3{margin:0;font-size:.95rem;white-space:nowrap;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.big{font-size:1.7rem;font-weight:700;margin:6px 0 0}
.fl{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:2px 6px;font-size:.82rem;text-align:right;white-space:nowrap}.fl>:nth-child(4n+1){text-align:left}
.row{display:flex;justify-content:space-between;font-size:.85rem;padding:2px 0}
.arb{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.arb .row b{color:var(--arb);white-space:nowrap;padding-left:8px}
.itot{margin-top:6px;padding-top:5px;border-top:1px dotted var(--line)}
.itot .row b{color:var(--ink);white-space:nowrap;padding-left:8px}
.arb .note{font-size:.72rem;margin:1px 0 3px}
.badge{font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:99px;background:#fef3c7;color:#92400e;white-space:nowrap;cursor:help}
.badge.p{background:#e0e7ff;color:#3730a3}
.est{font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:99px;background:#fde2e2;color:#991b1b;letter-spacing:.03em}
.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;height:340px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-top:10px}
summary{cursor:pointer;font-weight:600;font-size:.92rem}
.notes{font-size:.84rem;color:#374151;padding-left:18px}.notes li{margin-bottom:5px}
.wrap{overflow-x:auto;margin-top:10px}
.ctx{width:100%;border-collapse:collapse;font-size:.83rem}
.ctx th,.ctx td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:right;white-space:nowrap}
.ctx th:first-child,.ctx td:first-child{text-align:left;white-space:normal}
.ctx th{font-weight:600;background:#f3f4f6}
a{color:var(--us)}
footer{margin:18px 0 8px;font-size:.78rem;color:var(--mute)}
</style></head>
<body><main>
<div class="head"><h1>BC electricity trade</h1><span class="k" id="upd"></span></div>
<div class="live" id="live"></div>

<div class="bar">
 <div class="tabs" id="tabs"><button data-v="total" class="on">All interties</button><button data-v="us">BC ⇄ US</button><button data-v="ab">BC ⇄ Alberta</button></div>
 <span class="k">C$ = tie-line flows × hub prices (Mid-C, AESO pool), not BC Hydro's import bill or Powerex's margin.</span>
</div>
<div class="grid" id="cards"></div>

<div class="bar" style="margin-top:22px"><h2 style="margin:0">Monthly</h2>
 <div class="tabs" id="mode"><button data-m="cad" class="on">Net value (C$)</button><button data-m="gwh">Volume (GWh)</button></div></div>
<div class="chart"><canvas id="main"></canvas></div>

<details id="reported"><summary>BC Hydro reported figures (fiscal years)</summary><div id="ctx"></div></details>
<details id="method"><summary>Method &amp; caveats</summary><ul class="notes" id="notes"></ul></details>
<footer id="foot"></footer>
</main>
<script>
const C=n=>n==null?'n/a':(Math.abs(n)>=1e6?(n<0?'−':'')+'C$'+(Math.abs(n)/1e6).toFixed(1)+'M':(n<0?'−':'')+'C$'+Math.round(Math.abs(n)/1e3).toLocaleString()+'k');
const G=n=>(n/1000).toLocaleString(undefined,{maximumFractionDigits:n&&Math.abs(n)<1e5?1:0})+' GWh';
const P=n=>n==null?'n/a':'C$'+n.toFixed(0);
const M$=n=>n==null?'n/a':(n<0?'−':'')+'C$'+Math.abs(n).toLocaleString()+'M';
const T=s=>s?new Date(s).toLocaleString('en-CA',{timeZone:'America/Vancouver',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'n/a';
const D=s=>s?new Date(s).toLocaleDateString('en-CA',{timeZone:'America/Vancouver',month:'short',day:'numeric',year:'numeric'}):'n/a';
let data,view='total',mode='cad',chart;
fetch('dashboard.json?'+Date.now()).then(r=>r.json()).then(d=>{data=d;render();});
const tabs=(id,attr,set)=>document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{set(b.dataset[attr]);document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle('on',x===b));render();});
tabs('tabs','v',v=>view=v);tabs('mode','m',m=>mode=m);

function render(){
 const d=data,L=d.live||{};
 document.getElementById('upd').textContent=`Updated ${T(d.generated)} Pacific · refreshes hourly`;
 const lv=[];
 if(L.bch){lv.push(`Now: BC → US <b>${L.bch.us_mw} MW</b>`);lv.push(`BC → Alberta <b>${L.bch.ab_mw} MW</b>`);}
 if(L.pool_price)lv.push(`AB pool <b>${P(L.pool_price.cad_mwh)}</b>/MWh`);
 const lastDay=d.daily.filter(x=>x.midc_cad).slice(-1)[0];
 if(lastDay)lv.push(`Mid-C peak <b>${P(lastDay.midc_cad)}</b>/MWh <span class="k">(${d.midc_last_delivery})</span>`);
 document.getElementById('live').innerHTML=lv.map(x=>`<div class="pill">${x}</div>`).join('')+`<span class="k" style="align-self:center">${L.bch?T(L.bch.t_utc)+' · ':''}negative MW = BC importing</span>`;
 cards(d);mainChart(d);
}

function cards(d){
 const A=d.arbitrage_estimate||{periods:{}},f=A.assumptions?.offpeak_factor;
 const names={mtd:'This month',prev_month:'Last month',ytd:'Year to date',prev_year:'Last year'};
 document.getElementById('cards').innerHTML=Object.keys(names).map(k=>{
  const p=d.periods[k],s=p[view],us=p.us,ab=p.ab;
  const est=view==='total'?us.est_hours+ab.est_hours:s.est_hours, prov=view==='total'?us.prov_hours+ab.prov_hours:s.prov_hours;
  const badge=est?`<span class="badge" title="${est} hours use estimated flows or a carried-forward price">partly est.</span>`:(prov?`<span class="badge p" title="${prov} hours from BC Hydro real-time data">provisional</span>`:'');
  const ly=(k==='ytd'&&view==='total'&&p.same_period_last_year)?`<div class="k">Same period 2025: ${C(p.same_period_last_year.net_cad)}</div>`:'';
  const a=A.periods[k];let arb='';
  if(a){const b=a.base,o=a.offpeak_sens;
   const tm=view==='us'?b.timing_us_cad:view==='ab'?b.timing_ab_cad:b.timing_cad, tmo=view==='us'?o.timing_us_cad:view==='ab'?o.timing_ab_cad:o.timing_cad;
   arb=`<div class="arb"><div class="row"><span class="k">Trading breakdown</span></div>
      <div class="row" title="Part of the total above, not extra. Computed from the same hourly flows and hub prices as the total: how much more BC earned (or saved) by exporting in higher-priced hours and importing in cheaper ones, versus trading the same volumes at the month's average price. The only assumption is the sensitivity figure below, which prices US off-peak hours at ${f}× the peak price: ${C(tmo)}"><span>Of the total above: gain from better-timed trades</span><b>${C(tm)}</b></div>
   ${view==='total'?`<div class="row" title="A what-if, not counted in the total above. Each month, the volume BC both imported and exported, times the gap between its average export price and average import price. Partly overlaps the line above. The off-peak sensitivity (US off-peak hours at ${f}× peak) is the only price assumption: ${C(o.spread_cad)}"><span>Possible extra from price gap <span class="est">ESTIMATE</span></span><b>${C(b.spread_cad)}</b></div>`:''}
   <div class="k" style="margin-top:2px">Sensitivity, US off-peak at ${f}× peak: ${C(tmo)}${view==='total'?' / '+C(o.spread_cad):''}</div>
   ${view==='total'?`<div class="itot" title="Rough what-if: the total above plus the possible extra from the price gap. The better-timed gain is not added again because it is already in the total. Only assumption: sensitivity with US off-peak at ${f}× peak: ${C((o.net_cad??s.net_cad)+o.spread_cad)}"><div class="row"><span>Total with that extra added <span class="est">ESTIMATE</span></span><b>${C(s.net_cad+b.spread_cad)}</b></div><div class="k">Total above + possible extra${o.net_cad!=null?` · off-peak at ${f}× peak: ${C(o.net_cad+o.spread_cad)}`:''}</div></div>`:''}</div>`;}
  return `<div class="card"><h3>${names[k]} <span class="k">${p.label.replace(' to date','')}</span></h3>
  <div class="big ${s.net_cad>=0?'pos':'neg'}">${C(s.net_cad)} ${badge}</div>
  <div class="k" style="margin-bottom:6px">${s.net_mwh>=0?'Net export':'Net import'} ${G(Math.abs(s.net_mwh))}</div>
  <div class="fl"><span>Exports</span><span>${G(s.exp_mwh)}</span><span>${C(s.exp_cad)}</span><span class="k" title="average C$/MWh">@${s.avg_exp_price==null?'–':Math.round(s.avg_exp_price)}</span>
  <span>Imports</span><span>${G(s.imp_mwh)}</span><span>${C(s.imp_cad)}</span><span class="k" title="average C$/MWh">@${s.avg_imp_price==null?'–':Math.round(s.avg_imp_price)}</span></div>
  ${ly}${arb}</div>`;}).join('');
}

function mainChart(d){
 chart&&chart.destroy();
 const M=d.monthly,AM=Object.fromEntries((d.arbitrage_estimate?.monthly||[]).map(m=>[m.month,m]));
 const lab=M.map(m=>new Date(m.month+'-15').toLocaleDateString('en-CA',{month:'short',year:'2-digit'})+(m.est?'*':''));
 let ds,y;
 if(mode==='cad'){
  ds=[];
  if(view!=='ab')ds.push({type:'bar',label:'BC–US net',data:M.map(m=>m.us_net_cad),backgroundColor:'#2563eb',stack:'n'});
  if(view!=='us')ds.push({type:'bar',label:'BC–Alberta net',data:M.map(m=>m.ab_net_cad),backgroundColor:'#d97706',stack:'n'});
  if(view==='total'){ds.push({type:'line',label:'Gain from better-timed trades (part of bars)',data:M.map(m=>AM[m.month]?AM[m.month].timing_cad:null),borderColor:'#7c3aed',backgroundColor:'#7c3aed',borderDash:[5,4],pointRadius:2,tension:.25,stack:'t'});
   ds.push({type:'line',label:'Possible extra from price gap (estimate, not in bars)',data:M.map(m=>AM[m.month]?AM[m.month].spread_cad:null),borderColor:'#a78bfa',backgroundColor:'#a78bfa',borderDash:[2,3],pointRadius:2,tension:.25,stack:'s',hidden:true});}
  y={stacked:true,ticks:{callback:v=>C(v)}};
 }else{
  if(view==='total')ds=[{label:'Exports',data:M.map(m=>m.exp_mwh/1000),backgroundColor:'#0f8a5f'},{label:'Imports',data:M.map(m=>-m.imp_mwh/1000),backgroundColor:'#c2410c'}];
  else{const key=view==='us'?'us_net_mwh':'ab_net_mwh';ds=[{label:'Net GWh (+ = export)',data:M.map(m=>m[key]/1000),backgroundColor:M.map(m=>m[key]>=0?'#0f8a5f':'#c2410c')}];}
  y={stacked:true,title:{display:true,text:'GWh'}};
 }
 const fmt=mode==='cad'?C:v=>v.toFixed(0)+' GWh';
 chart=new Chart(document.getElementById('main'),{data:{labels:lab,datasets:ds},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
  scales:{x:{stacked:true},y},plugins:{legend:{labels:{boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)}}}}});
}

function ctx(d){
 const R=d.reported_context;if(!R)return '';
 const a=R.fy2026,b=R.fy2025,h=R.dashboard_fy2026,g=x=>Math.round(x/1000).toLocaleString();
 const row=(l,x,y,z)=>`<tr><td>${l}</td><td>${x}</td><td>${y}</td><td>${z}</td></tr>`;
 const tr=R.trade_income_ranges.map(x=>`${x.span} ${M$(x.low_cad_m)}–${M$(x.high_cad_m)}`).join('; ');
 return `<div class="wrap"><table class="ctx">
 <tr><th></th><th>BC Hydro FY2026<br><span class="k">Apr 25–Mar 26</span></th><th>This site, FY2026<br><span class="k">hub-valued</span></th><th>BC Hydro FY2025<br><span class="k">Apr 24–Mar 25</span></th></tr>
 ${row('Imports',`${a.imp_gwh.toLocaleString()} GWh · ${M$(a.imp_cad_m)}`,`${g(h.imp_mwh)} GWh · ${C(h.imp_cad)}`,`${b.imp_gwh.toLocaleString()} GWh · ${M$(b.imp_cad_m)}`)}
 ${row('Exports',`${a.exp_gwh.toLocaleString()} GWh · ${M$(a.exp_cad_m)}`,`${g(h.exp_mwh)} GWh · ${C(h.exp_cad)}`,`${b.exp_gwh.toLocaleString()} GWh · ${M$(b.exp_cad_m)}`)}
 ${row('Avg import / export price',`C$${a.imp_price} / ${a.exp_price}`,`${P(h.avg_imp_price)} / ${P(h.avg_exp_price).slice(2)}`,`C$${b.imp_price} / ${b.exp_price}`)}
 ${row('<b>Net trade value</b>',`<b class="neg">${M$(-a.net_cost_cad_m)}</b>`,`<b class="${h.net_cad>=0?'pos':'neg'}">${C(h.net_cad)}</b>`,`<b class="neg">${M$(-b.net_cost_cad_m)}</b>`)}
 ${row('Trade revenue (mostly Powerex, gross)',M$(a.trade_revenue_cad_m),'—',M$(b.trade_revenue_cad_m))}
 </table></div>
 <ul class="notes">
 <li>BC Hydro's import/export dollars include Powerex transfer pricing, transmission and shaping; its FY2026 import price was ${R.calibration_fy2026.imp_price_ratio}× this site's hub price.</li>
 <li>Powerex trade income (profit) is published only as ranges: ${tr}. Calendar-2025 trade revenue ≈ ${M$(R.trade_revenue_cy2025_cad_m)} (gross sales, derived).</li>
 <li>Sources: ${R.sources.map(x=>`<a href="${x.url}">${x.label.replace(/ \(.*\)/,'')}</a>`).join(' · ')}</li></ul>`;
}

function notes(d){
 const S=d.sources,r=x=>S[x]?`${D(S[x].from)} – ${D(S[x].to)}`:'none',f=d.arbitrage_estimate?.assumptions||{};
 return [
 `<b>Value</b> = hourly flow × hub price, in C$ (Bank of Canada USD/CAD). Exports earn, imports cost. Not BC Hydro/Powerex settlements.`,
 `<b>Prices:</b> BC–US uses the Mid-C day-ahead <i>peak</i> price for every hour (no free off-peak series), so night hours are likely overvalued; latest delivery day ${d.midc_last_delivery}, later days carry it forward (partly est.). BC–Alberta uses the hourly AESO pool price.`,
 `<b>Flows:</b> BC Hydro official hourly data (${r('us_bch')}), then EIA BPA–BC Hydro tie (${r('us_eia')}), then BC Hydro's 5-min real-time page, offset-corrected by ~${Math.round(d.us5_bias||200)} MW (provisional). BC–AB ${r('ab_aeso')} uses AESO settled schedules as a stand-in until BC Hydro posts actuals.`,
 `<b>Total</b> on each card = exports minus imports, each valued at hub market prices. It is not BC Hydro's import bill or Powerex's profit.`,
 `<b>Gain from better-timed trades</b> is part of the total, not extra, and uses the same data: each hour's flow × (that hour's price − the month's average price), summed. <b>Possible extra from price gap</b> (ESTIMATE, not in the total, partly overlaps the gain) = volume BC both imported and exported in a month × (average export price − average import price). <b>Total with that extra added</b> (ESTIMATE) = total + possible extra. The only assumption is the sensitivity figure, which prices US off-peak hours (${f.offpeak_hours||'nights/Sundays'}) at ${f.offpeak_factor}× the peak price.`,
 `* = month contains estimated hours. Positive = BC exporting/earning. Times are Pacific (BC is on permanent UTC−7).`
 ].map(x=>`<li>${x}</li>`).join('');
}
let staticDone=false;
const _r=render;render=function(){_r();if(!staticDone){staticDone=true;document.getElementById('ctx').innerHTML=ctx(data);document.getElementById('notes').innerHTML=notes(data);
 document.getElementById('foot').innerHTML=`Data: <a href="hourly.csv">hourly.csv</a> · <a href="daily_prices.csv">daily_prices.csv</a> · <a href="dashboard.json">dashboard.json</a> · <a href="https://github.com/warrenboyle/bc-powerflow">code</a>`;}};
</script></body></html>
