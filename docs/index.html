<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BC electricity trade</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#6b7280;--exp:#0f8a5f;--imp:#c2410c;--us:#2563eb;--ab:#d97706;--arb:#7c3aed;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0}
h2{font-size:1rem;margin:22px 0 8px}
.k{color:var(--mute);font-size:.8rem}
.pos{color:var(--exp)}.neg{color:var(--imp)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
.live{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:.85rem}
.pill b{font-size:1rem}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 10px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.tabs button{border:0;background:none;padding:7px 12px;font-size:.85rem;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}
.card h3{margin:0;font-size:.95rem;white-space:nowrap;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.big{font-size:1.7rem;font-weight:700;margin:6px 0 0}
.fl{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:2px 6px;font-size:.82rem;text-align:right;white-space:nowrap}.fl>:nth-child(4n+1){text-align:left}
.row{display:flex;justify-content:space-between;font-size:.85rem;padding:2px 0}
.arb{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.arb .row b{color:var(--arb);white-space:nowrap;padding-left:8px}
.arb .note{font-size:.72rem;margin:1px 0 3px}
.badge{font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:99px;background:#fef3c7;color:#92400e;white-space:nowrap;cursor:help}
.badge.p{background:#e0e7ff;color:#3730a3}
.est{font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:99px;background:#fde2e2;color:#991b1b;letter-spacing:.03em}
.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;height:340px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-top:10px}
summary{cursor:pointer;font-weight:600;font-size:.92rem}
.notes{font-size:.84rem;color:#374151;padding-left:18px}.notes li{margin-bottom:5px}
.wrap{overflow-x:auto;margin-top:10px}
.ctx{width:100%;border-collapse:collapse;font-size:.83rem}
.ctx th,.ctx td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:right;white-space:nowrap}
.ctx th:first-child,.ctx td:first-child{text-align:left;white-space:normal}
.ctx th{font-weight:600;background:#f3f4f6}
a{color:var(--us)}
.stale{background:#fef3c7;color:#92400e;border:1px solid #f59e0b;border-radius:8px;padding:2px 8px;font-weight:600}
#thru{margin:4px 0 0;padding:6px 12px;font-size:.8rem}#thru summary{font-size:.8rem;font-weight:600;color:var(--mute)}
#thru table{border-collapse:collapse;margin-top:6px}#thru td{padding:2px 10px 2px 0;vertical-align:top}
footer{margin:18px 0 8px;font-size:.78rem;color:var(--mute)}
</style></head>
<body><main>
<div class="head"><h1>BC electricity trade</h1><span class="k" id="upd"></span></div>
<div class="live" id="live"></div>
<details id="thru"><summary>Data through (each source lags differently)</summary><div id="thrut"></div></details>

<div class="bar">
 <div class="tabs" id="tabs"><button data-v="total" class="on">All interties</button><button data-v="us">BC ⇄ US</button><button data-v="ab">BC ⇄ Alberta</button></div>
 <span class="k">C$ = tie-line flows × hub prices (Mid-C, off-peak at 0.8×; AESO pool), not BC Hydro's import bill or Powerex's margin.</span>
</div>
<div class="grid" id="cards"></div>

<div class="bar" style="margin-top:22px"><h2 style="margin:0">Monthly</h2>
 <div class="tabs" id="mode"><button data-m="cad" class="on">Net value (C$)</button><button data-m="gwh">Volume (GWh)</button></div></div>
<div class="chart"><canvas id="main"></canvas></div>

<details id="reported"><summary>BC Hydro reported figures (fiscal years) – different measures</summary><div id="ctx"></div></details>
<details id="method"><summary>Method &amp; caveats</summary><ul class="notes" id="notes"></ul></details>
<footer id="foot"></footer>
</main>
<script>
const C=n=>n==null?'n/a':(Math.abs(n)>=1e6?(n<0?'−':'')+'C$'+(Math.abs(n)/1e6).toFixed(1)+'M':(n<0?'−':'')+'C$'+Math.round(Math.abs(n)/1e3).toLocaleString()+'k');
const G=n=>(n/1000).toLocaleString(undefined,{maximumFractionDigits:n&&Math.abs(n)<1e5?1:0})+' GWh';
const P=n=>n==null?'n/a':'C$'+n.toFixed(0);
const M$=n=>n==null?'n/a':(n<0?'−':'')+'C$'+Math.abs(n).toLocaleString()+'M';
// BC time: permanent UTC−7 since the Mar 2026 clock change (BC Reg. 20/2026). Older browser tz data would still
// show PST in winter for America/Vancouver, so use a fixed UTC−7 zone from then on.
const BZ=s=>new Date(s)>=new Date('2026-03-08T10:00:00Z')?'Etc/GMT+7':'America/Vancouver';
const T=s=>s?new Date(s).toLocaleString('en-CA',{timeZone:BZ(s),month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'n/a';
const D=s=>s?new Date(s).toLocaleDateString('en-CA',{timeZone:BZ(s),month:'short',day:'numeric',year:'numeric'}):'n/a';
let data,view='total',mode='cad',chart;
fetch('dashboard.json?'+Date.now()).then(r=>r.json()).then(d=>{data=d;render();});
const tabs=(id,attr,set)=>document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{set(b.dataset[attr]);document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle('on',x===b));render();});
tabs('tabs','v',v=>view=v);tabs('mode','m',m=>mode=m);

function render(){
 const d=data,L=d.live||{};
 upd(d);
 const lv=[];
 if(L.bch){lv.push(`Now: BC → US <b>${L.bch.us_mw} MW</b>`);lv.push(`BC → Alberta <b>${L.bch.ab_mw} MW</b>`);}
 if(L.pool_price)lv.push(`AB pool <b>${P(L.pool_price.cad_mwh)}</b>/MWh`);
 const lastDay=d.daily.filter(x=>x.midc_cad).slice(-1)[0];
 if(lastDay)lv.push(`Mid-C peak <b>${P(lastDay.midc_cad)}</b>/MWh <span class="k">(${d.midc_last_delivery})</span>`);
 document.getElementById('live').innerHTML=lv.map(x=>`<div class="pill">${x}</div>`).join('')+`<span class="k" style="align-self:center">${L.bch?T(L.bch.t_utc)+' · ':''}negative MW = BC importing</span>`;
 cards(d);mainChart(d);
}

function ago(ms){const m=Math.round(ms/6e4);return m<60?`${Math.max(m,0)} min ago`:m<48*60?`${(m/60).toFixed(m<600?1:0)} h ago`:`${Math.round(m/1440)} days ago`;}
function upd(d){
 const age=Date.now()-new Date(d.generated),el=document.getElementById('upd');
 const sched='checked every ~15 min when GitHub runs on time; source data lags';
 el.innerHTML=age>50*6e4?`<span class="stale" title="Last run ${T(d.generated)} BC time. GitHub's scheduler delays or drops runs when busy.">Last updated ${ago(age)} (update delayed)</span> · ${sched}`
  :`Updated ${ago(age)} (${T(d.generated)} BC time) · ${sched}`;
}
setInterval(()=>data&&upd(data),60000);
function thru(d){
 const X=d.data_through;if(!X)return '';
 const row=(k,v)=>{const x=X[k];if(!x)return '';const val=x.t?T(x.t):x.date?D(x.date+'T12:00:00Z'):'none';
  const lag=x.t?` <span class="k">(${ago(Date.now()-new Date(x.t))})</span>`:'';
  return `<tr><td>${x.label}</td><td><b>${val}</b>${lag}${x.note?` <span class="k">– ${x.note}</span>`:''}</td></tr>`;};
 return `<table>${['bch5','us_eia','us_bch','ab_bch','ab_aeso','pool','midc','fx'].map(k=>row(k)).join('')}</table><div class="k">Flow times are the end of the latest hour received, BC time. The newest hours use the 5-min page (provisional) until EIA/BC Hydro catch up.</div>`;
}

function cards(d){
 const A=d.arbitrage_estimate||{periods:{}},f=A.assumptions?.offpeak_factor;
 const names={mtd:'This month',prev_month:'Last month',ytd:'Year to date',prev_year:'Last year'};
 document.getElementById('cards').innerHTML=Object.keys(names).map(k=>{
  const p=d.periods[k],s=p[view],us=p.us,ab=p.ab;
  const est=view==='total'?us.est_hours+ab.est_hours:s.est_hours, prov=view==='total'?us.prov_hours+ab.prov_hours:s.prov_hours;
  const badge=est?`<span class="badge" title="${est} hours use estimated flows or a carried-forward price">partly est.</span>`:(prov?`<span class="badge p" title="${prov} hours from BC Hydro real-time data">provisional</span>`:'');
  const ly=(k==='ytd'&&view==='total'&&p.same_period_last_year)?`<div class="k">Same period 2025: ${C(p.same_period_last_year.net_cad)}</div>`:'';
  const a=A.periods[k];let arb='';
  if(a){const b=a.base,o=a.peak_only;const F=d.valuation?.offpeak_factor??0.8;
   const tm=view==='us'?b.timing_us_cad:view==='ab'?b.timing_ab_cad:b.timing_cad, tmo=view==='us'?o.timing_us_cad:view==='ab'?o.timing_ab_cad:o.timing_cad;
   const tTip=view==='ab'?'Part of the total above, not extra. Each hour\'s BC–Alberta flow × (that hour\'s AESO pool price − the month\'s average), summed: what BC gained by exporting in pricier hours and importing in cheaper ones.'
     :view==='us'?'Part of the total above, not extra. On the US tie the Mid-C price is one number per day, so this reflects which days BC traded on (plus the assumed '+F+'× off-peak discount), not hour-to-hour timing.'
     :'Part of the total above, not extra. Each hour\'s flow × (that hour\'s price − the month\'s average), summed. Alberta uses true hourly pool prices; on the US tie Mid-C is one price per day, so it captures day-to-day timing (plus the assumed '+F+'× off-peak discount), not hour-to-hour.';
   arb=`<div class="arb"><div class="row"><span class="k">Trading breakdown (both already in the total)</span></div>
      <div class="row" title="${tTip}"><span>Of the total above: gain from better-timed trades</span><b>${C(tm)}</b></div>
   ${view==='total'?`<div class="row" title="Part of the total above, not extra. Each month, the volume BC both imported and exported × (average export price − average import price). It overlaps the timing line, so don't add the two together."><span>Of the total above: margin on matched import/export volume</span><b>${C(b.spread_cad)}</b></div>`:''}
   ${view!=='ab'?`<div class="k" style="margin-top:2px" title="Alternative valuation: Mid-C peak price applied to every hour (no off-peak discount)">Peak-price-only alternative: ${C(view==='total'?o.net_cad:o.net_cad-ab.net_cad)}</div>`:''}</div>`;}
  return `<div class="card"><h3>${names[k]} <span class="k">${p.label.replace(' to date','')}</span></h3>
  <div class="big ${s.net_cad>=0?'pos':'neg'}">${C(s.net_cad)} ${badge}</div>
  <div class="k" style="margin-bottom:6px">${s.net_mwh>=0?'Net export':'Net import'} ${G(Math.abs(s.net_mwh))}</div>
  <div class="fl"><span>Exports</span><span>${G(s.exp_mwh)}</span><span>${C(s.exp_cad)}</span><span class="k" title="average C$/MWh">@${s.avg_exp_price==null?'–':Math.round(s.avg_exp_price)}</span>
  <span>Imports</span><span>${G(s.imp_mwh)}</span><span>${C(s.imp_cad)}</span><span class="k" title="average C$/MWh">@${s.avg_imp_price==null?'–':Math.round(s.avg_imp_price)}</span></div>
  ${ly}${arb}</div>`;}).join('');
}

function mainChart(d){
 (Chart.getChart('main')||chart)?.destroy();chart=null;
 const M=d.monthly,AM=Object.fromEntries((d.arbitrage_estimate?.monthly||[]).map(m=>[m.month,m]));
 const lab=M.map(m=>new Date(m.month+'-15').toLocaleDateString('en-CA',{month:'short',year:'2-digit'})+(m.est?'*':''));
 let ds,y;
 if(mode==='cad'){
  ds=[];
  if(view!=='ab')ds.push({type:'bar',label:'BC–US net',data:M.map(m=>m.us_net_cad),backgroundColor:'#2563eb',stack:'n'});
  if(view!=='us')ds.push({type:'bar',label:'BC–Alberta net',data:M.map(m=>m.ab_net_cad),backgroundColor:'#d97706',stack:'n'});
  if(view==='total'){ds.push({type:'line',label:'Of the total: gain from better-timed trades',data:M.map(m=>AM[m.month]?AM[m.month].timing_cad:null),borderColor:'#7c3aed',backgroundColor:'#7c3aed',borderDash:[5,4],pointRadius:2,tension:.25,stack:'t'});
   ds.push({type:'line',label:'Of the total: margin on matched import/export volume',data:M.map(m=>AM[m.month]?AM[m.month].spread_cad:null),borderColor:'#a78bfa',backgroundColor:'#a78bfa',borderDash:[2,3],pointRadius:2,tension:.25,stack:'s',hidden:true});}
  y={stacked:true,ticks:{callback:v=>C(v)}};
 }else{
  if(view==='total')ds=[{type:'bar',label:'Exports',data:M.map(m=>m.exp_mwh/1000),backgroundColor:'#0f8a5f'},{type:'bar',label:'Imports (shown negative)',data:M.map(m=>-m.imp_mwh/1000),backgroundColor:'#c2410c'}];
  else{const key=view==='us'?'us_net_mwh':'ab_net_mwh';ds=[{type:'bar',label:'Net GWh (+ = export)',data:M.map(m=>m[key]/1000),backgroundColor:M.map(m=>m[key]>=0?'#0f8a5f':'#c2410c')}];}
  y={stacked:true,title:{display:true,text:'GWh'}};
 }
 const fmt=mode==='cad'?C:v=>(v==null||isNaN(v))?'–':v.toFixed(0)+' GWh';
 chart=new Chart(document.getElementById('main'),{type:'bar',data:{labels:lab,datasets:ds},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
  scales:{x:{stacked:true},y},plugins:{legend:{labels:{boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)}}}}});
}

function ctx(d){
 const R=d.reported_context;if(!R)return '';
 const a=R.fy2026,b=R.fy2025,h=R.dashboard_fy2026,g=x=>Math.round(x/1000).toLocaleString();
 const row=(l,x,y,z)=>`<tr><td>${l}</td><td>${x}</td><td>${y}</td><td>${z}</td></tr>`;
 const tr=R.trade_income_ranges.map(x=>`${x.span} ${M$(x.low_cad_m)}–${M$(x.high_cad_m)}`).join('; ');
 return `<div class="wrap"><table class="ctx">
 <tr><th></th><th>BC Hydro FY2026<br><span class="k">Apr 25–Mar 26</span></th><th>This site, FY2026<br><span class="k">tie flows × hub prices</span></th><th>BC Hydro FY2025<br><span class="k">Apr 24–Mar 25</span></th></tr>
 ${row('Imports',`${a.imp_gwh.toLocaleString()} GWh · ${M$(a.imp_cad_m)}`,`${g(h.imp_mwh)} GWh · ${C(h.imp_cad)}`,`${b.imp_gwh.toLocaleString()} GWh · ${M$(b.imp_cad_m)}`)}
 ${row('Exports',`${a.exp_gwh.toLocaleString()} GWh · ${M$(a.exp_cad_m)}`,`${g(h.exp_mwh)} GWh · ${C(h.exp_cad)}`,`${b.exp_gwh.toLocaleString()} GWh · ${M$(b.exp_cad_m)}`)}
 ${row('Avg import / export price',`C$${a.imp_price} / ${a.exp_price}`,`${P(h.avg_imp_price)} / ${P(h.avg_exp_price).slice(2)}`,`C$${b.imp_price} / ${b.exp_price}`)}
 ${row('<b>Net trade value</b>',`<b class="neg">${M$(-a.net_cost_cad_m)}</b>`,`<b class="${h.net_cad>=0?'pos':'neg'}">${C(h.net_cad)}</b>`,`<b class="neg">${M$(-b.net_cost_cad_m)}</b>`)}
 ${row('Trade revenue (mostly Powerex, gross)',M$(a.trade_revenue_cad_m),'—',M$(b.trade_revenue_cad_m))}
 </table></div>
 <ul class="notes">
 <li><b>Different measures, not like-for-like.</b> This site's tie-line flows include Powerex trading and other non-purchase flows, valued at hub prices. BC Hydro's reported trade is its domestic purchases and sales at Powerex transfer prices. So the two columns shouldn't be reconciled (e.g. BC Hydro's FY2026 average import price is ${R.different_measures_fy2026.imp_price_ratio}× and export price ${R.different_measures_fy2026.exp_price_ratio}× this site's hub-valued averages).</li>
 <li>Powerex trade income (profit) is published only as ranges: ${tr}. Calendar-2025 trade revenue ≈ ${M$(R.trade_revenue_cy2025_cad_m)} (gross sales, derived).</li>
 <li>Sources: ${R.sources.map(x=>`<a href="${x.url}">${x.label.replace(/ \(.*\)/,'')}</a>`).join(' · ')}</li></ul>`;
}

function notes(d){
 const S=d.sources,r=x=>S[x]?`${D(S[x].from)} – ${D(S[x].to)}`:'none',f=d.valuation||{},q=d.source_qa||{},e=q.us_eia_vs_bch||{};
 const qa=e.mean_bias_mw!=null?`EIA vs BC Hydro official, BC–US, ${e.hours.toLocaleString()} overlapping hours (${D(e.from)} – ${D(e.to)}): mean bias ${e.mean_bias_mw} MW, median ${e.median_bias_mw} MW, mean abs. error ${e.mae_mw} MW.`:`EIA vs BC Hydro official: no overlapping hours yet.`;
 return [
 `<b>Value</b> = hourly flow × hub price, in C$ (Bank of Canada USD/CAD). Exports earn, imports cost. Not BC Hydro/Powerex settlements.`,
 `<b>Mid-C</b> = Mid-Columbia trading hub (central Washington), the Pacific Northwest reference price. The value shown is the ICE day-ahead peak index (HE7–HE22 Mon–Sat), in US$ converted to C$. EIA publishes it with a lag of several days, so the latest price is carried forward.`,
 `<b>Updates:</b> a GitHub Actions job is scheduled every 15 min, but GitHub's scheduler is best-effort and often delays or skips runs, so the page can be hours old (shown in amber). Each source also has its own lag; see "Data through".`,
 `<b>Prices:</b> BC–US uses the Mid-C day-ahead peak price, with off-peak hours priced at ${f.offpeak_factor??0.8}× (an assumption; off-peak = ${f.offpeak_hours||'nights, Sundays, NERC holidays'}). Latest delivery day ${d.midc_last_delivery}; later days carry it forward (partly est.). BC–Alberta uses the hourly AESO pool price. The "peak-price-only" line on the cards prices every US hour at peak.`,
 `<b>Flows:</b> BC Hydro official hourly data (${r('us_bch')}), then EIA BPA–BC Hydro tie (${r('us_eia')}), then BC Hydro's 5-min real-time page, offset-corrected by ~${Math.round(d.us5_bias||200)} MW (provisional). BC–AB ${r('ab_aeso')} uses AESO settled schedules as a stand-in until BC Hydro posts actuals. ${qa} Every source is kept per hour in <a href="source_compare.csv">source_compare.csv</a>.`,
 `<b>Trading breakdown</b>: both lines are part of the total, computed from the same data, and overlap each other, so don't add them to the total or to each other. <i>Better-timed trades</i> = each hour's flow × (that hour's price − the month's average price). Alberta has true hourly prices; on the US tie Mid-C is one price per day, so it reflects day-to-day timing (plus the assumed off-peak discount), not hour-to-hour. <i>Matched-volume margin</i> = volume BC both imported and exported in a month × (average export price − average import price).`,
 `* = month contains estimated hours. Positive = BC exporting/earning. Times are BC time (UTC−7; Pacific with DST before Nov 2026). Mid-C days and off-peak hours follow US Pacific time.`
 ].map(x=>`<li>${x}</li>`).join('');
}
function completeness(d){
 const nm={mtd:'this month',prev_month:'last month',ytd:'year to date',prev_year:'last year'};
 return Object.keys(nm).map(k=>{const c=d.periods[k]?.completeness;if(!c)return '';const m=c.us.missing_to_through+c.ab.missing_to_through;
  return `${nm[k]} ${m?m+' missing':'complete'}`;}).filter(Boolean).join(', ');
}
let staticDone=false;
const _r=render;render=function(){_r();if(!staticDone){staticDone=true;document.getElementById('ctx').innerHTML=ctx(data);document.getElementById('thrut').innerHTML=thru(data);document.getElementById('notes').innerHTML=notes(data);
 document.getElementById('foot').innerHTML=`Data: <a href="hourly.csv">hourly.csv</a> · <a href="daily_prices.csv">daily_prices.csv</a> · <a href="source_compare.csv">source_compare.csv</a> · <a href="dashboard.json">dashboard.json</a> · <a href="https://github.com/warrenboyle/bc-powerflow">code</a><br>Hourly data completeness: ${completeness(data)} · Times in BC time (UTC−7)`;}};
</script></body></html>
