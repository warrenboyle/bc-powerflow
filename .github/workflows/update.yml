name: update
on:
  schedule: [{cron: "7,22,37,52 * * * *"}]   # every 15 min, off the top of the hour
  workflow_dispatch:
    inputs:   # optional: fill these to record a peak event and snapshot conditions (see README "Peak events")
      date: {description: "Event date, BC (YYYY-MM-DD). Leave empty for a normal data run.", required: false, default: ""}
      start: {description: "Start, BC clock time (HH:00)", required: false, default: "17:00"}
      end: {description: "End, BC clock time (HH:00, exclusive)", required: false, default: "21:00"}
      noticed_at: {description: "When the notice arrived, ISO 8601 with offset (e.g. 2026-11-25T16:30-07:00)", required: false, default: ""}
      source: {description: "Where the notice came from", required: false, default: "BC Hydro Peak Saver email"}
permissions: {contents: write}
concurrency: {group: update, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/update.yml}
      - run: pip install pandas openpyxl xlrd "tzdata>=2026.6"
      - name: reservoirs (best-effort; a failing source must not block the dashboard)
        continue-on-error: true
        run: python scripts/fetch_reservoirs.py
        env:
          PYTHONTZPATH: ""
      - name: peak event snapshot (only when dispatched with a date)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.date != '' }}
        run: python scripts/snapshot_event.py --date "$EV_DATE" --start "$EV_START" --end "$EV_END" --noticed-at "$EV_NOTICED" --source "$EV_SOURCE"
        env:   # inputs passed via env, never pasted into the script
          EV_DATE: ${{ inputs.date }}
          EV_START: ${{ inputs.start }}
          EV_END: ${{ inputs.end }}
          EV_NOTICED: ${{ inputs.noticed_at }}
          EV_SOURCE: ${{ inputs.source }}
          AESO_API_KEY: ${{ secrets.AESO_API_KEY }}
          PYTHONTZPATH: ""
      - run: python fetch.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          AESO_API_KEY: ${{ secrets.AESO_API_KEY }}
          PYTHONTZPATH: ""   # use the pinned tzdata package (BC permanent UTC-7 from Nov 2026)
      - name: commit and push (rebase + retry)
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add docs/
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -q -m "data update"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "push failed after retries"; exit 1
