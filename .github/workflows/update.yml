name: update
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: update, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas openpyxl xlrd "tzdata>=2026.6"
      - run: python fetch.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          AESO_API_KEY: ${{ secrets.AESO_API_KEY }}
          PYTHONTZPATH: ""   # use the pinned tzdata package (BC permanent UTC-7 from Nov 2026)
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add docs/ && git commit -m "data update" || true
          git pull --rebase -q || true
          git push
