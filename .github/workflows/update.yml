name: update
on:
  schedule: [{cron: "7,22,37,52 * * * *"}]   # every 15 min, off the top of the hour
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: update, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/update.yml}
      - run: pip install pandas openpyxl xlrd "tzdata>=2026.6"
      - run: python fetch.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          AESO_API_KEY: ${{ secrets.AESO_API_KEY }}
          PYTHONTZPATH: ""   # use the pinned tzdata package (BC permanent UTC-7 from Nov 2026)
      - name: commit and push (rebase + retry)
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add docs/
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -q -m "data update"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "push failed after retries"; exit 1
